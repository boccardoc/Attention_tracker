name: deploy-pages

# Publishes to GitHub Pages (Pages source must be set to "GitHub Actions" in repo settings).
# Builds the dashboard as a static site and publishes it to GitHub Pages, so it can be
# opened from any device (including an iPad) at:
#   https://boccardoc.github.io/Attention_tracker/
#
# Re-triggered after the repo was switched from private to public, to force a fresh
# deploy under public-repo Pages (no login required to view).
#
# The data is baked into the build. By default it uses seed_demo.py (synthetic) so the
# site works with no API keys; swap that step for the real collector once you have a
# populated data/attention.db.

on:
  push:
    branches:
      - claude/attention-rotation-monitor-dmgxsk
    paths:
      - "web/**"
      - "collector/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast, and in plain English, when the repo has no Pages site. Without this
      # the run burns a full build and then dies inside configure-pages with the opaque
      # "Get Pages site failed: Not Found" / "Resource not accessible by integration".
      #
      # The usual cause is a visibility change: switching the repo public -> private
      # DISABLES its Pages site, and switching back to public does NOT restore the
      # "Source: GitHub Actions" setting -- it has to be re-selected by hand afterwards.
      - name: Preflight — is GitHub Pages enabled?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo 000)

          if [ "$status" = "200" ]; then
            echo "Pages is enabled. Deploying to: $(python3 -c 'import json;print(json.load(open("/tmp/pages.json")).get("html_url",""))')"
            exit 0
          fi

          echo "::error title=GitHub Pages is not enabled::HTTP $status from the Pages API."
          cat <<'MSG'
          ─────────────────────────────────────────────────────────────────────
          This repository has no GitHub Pages site, so there is nothing to
          deploy to. The build itself is fine — do not go looking for a code bug.

          Fix it in the browser (an Actions token cannot create a Pages site;
          that needs repo-admin rights):

            1. Settings → General → Change visibility → Public
            2. Settings → Pages → Source → "GitHub Actions"

          Order matters: a visibility change WIPES the Source setting, so step 2
          must come after step 1.

          Then re-run this workflow (Actions → deploy-pages → Run workflow).
          ─────────────────────────────────────────────────────────────────────
          MSG
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector deps
        run: pip install -r collector/requirements.txt

      # Publish REAL data when the collector has produced any, otherwise fall back to
      # the synthetic demo so the site is never broken. The cutover is automatic: the
      # first successful collect.yml run creates data-snapshot and this step starts
      # using it, with no edit to this workflow.
      - name: Populate database
        run: |
          mkdir -p data
          if git fetch origin data-snapshot --depth=1 2>/dev/null; then
            git show origin/data-snapshot:attention.db > data/attention.db
            echo "Publishing REAL collected data ($(stat -c%s data/attention.db) bytes)"
          else
            echo "::notice::No data-snapshot branch yet — publishing synthetic demo data."
            python collector/seed_demo.py
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build static site
        working-directory: web
        env:
          STATIC: "1"
          # Must match the repository name exactly (GitHub Pages paths are case-sensitive).
          BASE_PATH: "/Attention_tracker"
        run: npm run build

      # NOTE: no `enablement: true` here. Creating a Pages site requires admin rights
      # that GITHUB_TOKEN does not have, so it could never self-heal — all it did was
      # replace a readable error with "Resource not accessible by integration". The
      # preflight step above reports the real problem instead.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
